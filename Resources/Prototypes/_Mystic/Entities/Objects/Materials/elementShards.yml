- type: entity
  abstract: true
  parent: BaseItem
  id: ElementShardBase
  name:  unnamed crystal
  description:  A small piece of elemental crystal.
  components:
  - type: Sharp
  - type: Sprite
    layers:
    - sprite: _Mystic/Objects/Materials/crystalItem.rsi
      state: AnemoCrystal
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: MeleeWeapon
    wideAnimationRotation: -22.5
    attackRate: 1.5
    damage:
      types:
        Slash: 3.5
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 5000

- type: entity
  parent: ElementShardBase
  id: ElementShardAnemo
  name: anemo crystal shard
  description: A small piece of crystal.
  components:
  - type: Sprite
    layers:
    - sprite: _Mystic/Objects/Materials/crystalItem.rsi
      state: AnemoCrystal
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Stack
    count: 1
    stackType: ElementShardAnemo

